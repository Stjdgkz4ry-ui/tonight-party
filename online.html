function peer(i){if(peers.has(i))return peers.get(i);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});const p={pc,ice:[],offered:false};peers.set(i,p);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)signal(i,{type:'ice',candidate:e.candidate.toJSON()}).catch(()=>{})};pc.ontrack=e=>{let v=$('peer'+i);if(!v){v=document.createElement('video');v.id='peer'+i;v.autoplay=true;v.playsInline=true;v.style='width:100%;background:#111;border-radius:12px';$('videos').append(v)}v.srcObject=e.streams[0];attachVideos();v.play().catch(()=>{});videoNote('视频已连接')};pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')videoNote('视频直连失败，请尝试其他网络或重新开启视频');if(pc.connectionState==='connected')videoNote('视频已连接')};return p}

let musicOn=false,musicGain=null,musicTimer=null,musicStep=0,musicNext=0,speakingNow=false,listening=false,recognizer=null,pendingSpeech=null,speechTurn='',recognitionDucked=false;
const musicPresets={jazz:{bpm:76,chords:[[48,52,55,59],[45,48,52,55],[50,53,57,60],[43,47,50,53]],mel:[67,71,69,64,62,65,69,67]},lounge:{bpm:88,chords:[[45,52,55,60],[41,48,52,57],[48,55,59,64],[43,50,53,59]],mel:[64,67,69,72,71,67,65,62]},calm:{bpm:60,chords:[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59]],mel:[72,67,64,69,65,60,62,67]}};
function musicLevel(){if(musicGain&&audio){const v=Number($('musicVolume').value)/100*.85*((speakingNow||listening)?0.25:1)*(stream?0.48:1);musicGain.gain.setTargetAtTime(musicOn?v:0,audio.currentTime,.12)}}
function musicNote(midi,at,duration,amp,type='sine'){if(!musicGain||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(amp,at+.025);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g).connect(musicGain);o.start(at);o.stop(at+duration+.03)}
function scheduleMusic(){if(!musicOn||!audio||audio.state!=='running')return;const p=musicPresets[$('musicStyle').value],beat=60/p.bpm;if(musicNext<audio.currentTime)musicNext=audio.currentTime+.04;while(musicNext<audio.currentTime+.18){const step=musicStep%16,ch=p.chords[Math.floor(step/4)],at=musicNext;if(step%4===0){musicNote(ch[0]-12,at,beat*1.5,.24,'triangle');for(const v of ch.slice(1))musicNote(v,at+.02,beat*2.6,.095)}else if(step%4===2){musicNote(ch[0],at,beat*.75,.13,'triangle')}if(step%2===0)musicNote(p.mel[(musicStep/2)%p.mel.length],at+.1,beat*.9,.11);musicNext+=beat;musicStep++}}
async function toggleMusic(){if(roomAudioEnabled){roomAudioEnabled=false;stopMusic();$('musicToggle').textContent='🔊 开启房间音乐';return}try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();await audio.resume();if(audio.state!=='running')throw Error('浏览器尚未允许声音');roomAudioEnabled=true;$('musicToggle').textContent='🔇 本机静音';applyRoomSong(true)}catch(e){$('musicState').textContent=e.message}}
function stopMusic(){musicOn=false;clearInterval(musicTimer);musicLevel();}
function changeMusic(){musicStep=0;if(audio)musicNext=audio.currentTime+.05}
function numberZh(t){if(/^\d+$/.test(t))return Number(t);const digits={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};if(t==='十')return 10;if(t.includes('十')){const [a,b]=t.split('十');return (a?digits[a]:1)*10+(b?digits[b]:0)}return digits[t]}
function parseBidSpeech(text){const t=text.replace(/[\s，。！？、,.!?]/g,'').replace(/個/g,'个').replace(/點/g,'点').replace(/開/g,'开');if(/^(开|开骰|我要开|开盅|我不信)$/.test(t))return {action:'open'};const m=t.match(/^(?:我叫|我要叫|叫)?([0-9一二两三四五六七八九十]+)(?:个|颗|顆)([0-9一二两三四五六七八九十]+)(?:点|骰子)?$/);if(!m)return null;const q=numberZh(m[1]),f=numberZh(m[2]);return Number.isInteger(q)&&Number.isInteger(f)&&q>=1&&q<=20&&f>=1&&f<=6?{action:'bid',q,f}:null}
function currentSpeechTurn(s){return JSON.stringify([s?.code,s?.round,s?.phase,s?.turn,s?.bid])}
function syncSpeech(s){const k=currentSpeechTurn(s);if(speechTurn&&speechTurn!==k)cancelSpeech();speechTurn=k}
function cancelSpeech(){if(recognizer){const old=recognizer;recognizer=null;try{old.abort()}catch{}}listening=false;pendingSpeech=null;musicLevel();$('voiceConfirm').hidden=true;$('speechStatus').textContent='';$('speechBid').textContent='🎙️ 说出点数'}
function listenBid(){if(!state||state.phase!=='play'||state.turn!==state.me||!peeked)return;if(listening){cancelSpeech();return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('speechStatus').textContent='此浏览器不支持语音识别，请使用按钮叫骰。';return}cancelSpeech();if(window.speechSynthesis)speechSynthesis.cancel();speakingNow=false;const rec=new SR();recognizer=rec;rec.lang='zh-CN';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=3;const turn=currentSpeechTurn(state);listening=true;musicLevel();$('speechBid').textContent='🎙️ 正在听… 点击取消';$('speechStatus').textContent='请说「五个三」或「开骰」';rec.onresult=e=>{if(recognizer!==rec||turn!==currentSpeechTurn(state))return;let cmd=null,words='';for(const a of e.results[0]){words=a.transcript;cmd=parseBidSpeech(words);if(cmd)break}if(!cmd){$('speechStatus').textContent='未识别：'+words+'，请重试';return}if(cmd.action==='bid'){if(cmd.q>Number($('qty').max)){ $('speechStatus').textContent='数量超过本桌骰子总数';return}$('qty').value=cmd.q;$('face').value=cmd.f;refreshFaces();if($('raise').disabled){$('speechStatus').textContent='该叫骰不符合加叫规则';return}}else if(!state.bid){$('speechStatus').textContent='当前还没有人叫骰';return}pendingSpeech={...cmd,turn};$('speechStatus').textContent=cmd.action==='open'?'识别到：开骰':'识别到：'+cmd.q+' 个 '+cmd.f+' 点';$('voiceConfirm').hidden=false};rec.onerror=e=>{if(recognizer===rec)$('speechStatus').textContent='语音识别未完成：'+e.error+'，可直接使用按钮'};rec.onend=()=>{if(recognizer!==rec)return;recognizer=null;listening=false;musicLevel();$('speechBid').textContent='🎙️ 说出点数'};try{rec.start()}catch(e){cancelSpeech();$('speechStatus').textContent='无法启动语音识别，请使用按钮'}}
function confirmSpeech(){const p=pendingSpeech;if(!p||p.turn!==currentSpeechTurn(state)){cancelSpeech();return}cancelSpeech();if(p.action==='bid'){$('qty').value=p.q;$('face').value=p.f;refreshFaces();if(!$('raise').disabled)gameAction('bid')}else if(state.bid)gameAction('open')}
setInterval(()=>{if(musicOn){musicLevel();if(audio?.state!=='running')$('musicState').textContent='音乐暂停，请点击关闭后重新开启'}},500);

async function selectRoomSong(id,paused=false,offset=0){if(!state||!roomTracks.some(t=>t[0]===id))return;if(!roomAudioEnabled)await toggleMusic();await act('chat',{message:'🎵DT1 '+id+' '+(paused?'P':'R')+' '+(Date.now()+2200)+' '+Math.max(0,Math.round(offset))})}
function roomPosition(x){return x.offset+(x.paused?0:Math.max(0,Date.now()-x.at))}
function nextTrack(){const i=roomTracks.findIndex(t=>t[0]===roomSong?.id);selectRoomSong(roomTracks[(i+1)%roomTracks.length][0])}
function pauseRoomSong(){if(roomSong)selectRoomSong(roomSong.id,!roomSong.paused,roomPosition(roomSong))}
function applyRoomSong(force=false){stopMusic();if(!roomSong){$('musicState').textContent='等待点歌';return}const t=roomTracks.find(t=>t[0]===roomSong.id);$('musicState').textContent=t[1]+(roomSong.paused?' · 全桌暂停':roomAudioEnabled?' · 全桌播放':' · 本机静音');if(!roomAudioEnabled||roomSong.paused||!audio||audio.state!=='running')return;$('musicStyle').value=t[0];musicGain=musicGain||audio.createGain();try{musicGain.disconnect()}catch{}musicGain.connect(audio.destination);const beat=60/musicPresets[t[0]].bpm;const elapsed=roomPosition(roomSong)/1000;musicStep=Math.ceil(elapsed/beat);musicNext=audio.currentTime+Math.max(.03,(roomSong.at-Date.now())/1000)+Math.max(0,musicStep*beat-elapsed);musicOn=true;musicLevel();musicTimer=setInterval(scheduleMusic,80);scheduleMusic()}
function parseRoomSong(m){const v=/^🎵DT1 ([a-z]+) ([PR]) (\d{13}) (\d{1,12})$/.exec(m.text);if(!v||!roomTracks.some(t=>t[0]===v[1]))return null;const at=Number(v[3]);if(at>Date.now()+60000)return null;return {id:v[1],paused:v[2]==='P',at,offset:Number(v[4]),key:m.text,name:m.name}}
function renderSongQueue(s){if(roomMusicCode!==s.code){closeSong();roomMusicCode=s.code}const list=s.chat.map(parseRoomSong).filter(Boolean);const latest=list[list.length-1];if(latest&&latest.key!==roomCommand){roomCommand=latest.key;roomSong=latest;applyRoomSong();searchSongs()}const k=JSON.stringify(list);if(k===songQueueKey)return;songQueueKey=k;$('songQueue').replaceChildren();for(const m of list.slice(-8).reverse()){const el=document.createElement('div');el.textContent=m.name+' · '+roomTracks.find(t=>t[0]===m.id)[1]+(m.paused?' · 暂停':'');$('songQueue').append(el)}}
