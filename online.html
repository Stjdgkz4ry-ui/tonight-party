<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不醉不归 · 真人联机</title><style> *{box-sizing:border-box}body{background:#092b24;color:#fff;font:18px system-ui;margin:auto;max-width:560px;padding:16px}section{background:#164437;border:1px solid #c2a465;border-radius:18px;padding:16px;margin:12px 0}button,input{font:inherit;border:1px solid #c2a465;border-radius:10px;padding:12px;margin:4px 0;max-width:100%}button{background:#ffda65;color:#17251d;font-weight:bold}button:disabled{opacity:.45}input{background:#fff;color:#111;width:100%}a{color:#ffda65}#chat{height:160px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}#dice{font-size:47px;letter-spacing:5px}#seats{line-height:1.8}small{color:#dfd8bb} [hidden]{display:none!important}</style><h1>🎲 不醉不归</h1><p>真人联机 · Drink Together</p><a href="./">返回原版小游戏</a><section id="lobby"><input id="nick" maxlength="24" placeholder="你的昵称"><button onclick="enter('create')">创建房间</button><input id="code" maxlength="10" placeholder="输入好友邀请码"><button onclick="enter('join')">加入房间</button></section><section id="game" hidden><strong id="room"></strong> <button onclick="share()">复制邀请链接</button><div id="seats"></div><p id="status"></p><div id="dice"></div><button id="start" onclick="act('start')">开始 / 下一局</button><button id="shake" onclick="act('shake')">🎲 摇骰</button><div id="controls" hidden><label>数量<input id="qty" type="number" min="1" max="20" value="3"></label><label>点数<input id="face" type="number" min="1" max="6" value="2"></label><button onclick="act('bid')">叫骰</button><button id="open" onclick="act('open')">开骰</button></div><pre id="result" style="white-space:pre-wrap"></pre><small>每人5颗骰，1点百搭；不足4人由明确标识的机器人补位。饮酒自愿。</small><hr><div id="chat"></div><input id="msg" maxlength="300" placeholder="发消息"><button onclick="send()">发送</button><button onclick="leave()">退出房间</button></section><p id="error" role="status"></p><script>
const $=id=>document.getElementById(id), key='sb_publishable_J2YJjwZmWfmm0URtc-xpRQ_nZD5zkoq', url='https://qmjcxmktozldpaujyeva.supabase.co/rest/v1/rpc/drink_party_action';
let token=localStorage.getItem('dt_token');if(!token){token=Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('dt_token',token)}
let state=null,busy=false,lastChat='',botAt=0,botKey='';
$('code').value=new URLSearchParams(location.search).get('room')||localStorage.getItem('dt_room')||'';$('nick').value=localStorage.getItem('dt_nick')||'';
async function act(action,extra={}){if(busy)return;busy=true;try{const res=await fetch(url,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({action,room:state?.code||$('code').value.trim(),token,nickname:$('nick').value,...extra,...(action==='bid'?{qty:Number($('qty').value),face:Number($('face').value)}:{})})});const data=await res.json();if(!res.ok)throw Error(data.message||'连接失败');state=data;$('error').textContent='';render();}catch(e){$('error').textContent='操作提示：'+e.message;}finally{busy=false}}
async function enter(action){await act(action);if(state){localStorage.setItem('dt_room',state.code);localStorage.setItem('dt_nick',$('nick').value)}}
function render(){const s=state,n=[...s.names];while(n.length<4)n.push('🤖 机器人 '+(n.length+1));$('lobby').hidden=true;$('game').hidden=false;$('room').textContent='邀请码：'+s.code;$('seats').textContent=n.map((v,i)=>(i===s.turn&&s.phase==='play'?'▶ ':'')+v+(i===s.me?'（你）':'' )).join(' · ');$('status').textContent=({lobby:'等待好友加入，房主可开始',shake:'等待所有真人摇骰',play:'轮到 '+n[s.turn],end:'本局结束'})[s.phase]+(s.bid?' ｜ '+n[s.bid.by]+' 叫 '+s.bid.q+' 个 '+s.bid.f:'');$('dice').textContent=(s.dice||[]).map(v=>'⚀⚁⚂⚃⚄⚅'[v-1]).join('');$('start').hidden=s.me!==0||!['lobby','end'].includes(s.phase);$('shake').hidden=s.phase!=='shake';$('shake').disabled=s.ready.includes(s.me);$('controls').hidden=s.phase!=='play'||s.turn!==s.me;$('open').disabled=!s.bid;$('result').textContent=s.outcome?'实际数量 '+s.outcome.actual+'，'+n[s.outcome.winner]+' 赢！\n'+s.hands.map((h,i)=>n[i]+': '+h.join(' ')).join('\n'):'';const chat=s.chat.map(m=>m.name+'：'+m.text).join('\n');if(chat!==lastChat){$('chat').textContent=chat;$('chat').scrollTop=$('chat').scrollHeight;lastChat=chat}const b=JSON.stringify([s.phase,s.turn,s.bid]);if(b!==botKey){botKey=b;botAt=Date.now()+1600}}
function send(){const message=$('msg').value.trim();if(message){$('msg').value='';act('chat',{message})}}
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});function leave(){state=null;localStorage.removeItem('dt_room');$('game').hidden=true;$('lobby').hidden=false;history.replaceState(null,'',location.pathname)}
async function share(){const link=location.origin+location.pathname+'?room='+state.code;try{await navigator.clipboard.writeText(link);$('error').textContent='邀请链接已复制'}catch{prompt('复制链接',link)}}
setInterval(()=>{if(!state||busy||document.hidden)return;if(state.phase==='play'&&state.turn>=state.names.length&&Date.now()>=botAt)act('bot');else act('state')},1800);
</script></html>
