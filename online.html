function closePeer(i){const p=peers.get(i);if(p)p.pc.close();peers.delete(i);$('peer'+i)?.remove()}
async function receive(m){const i=m.sender,d=m.payload;if(d.type==='bye'){closePeer(i);return}if(d.type==='ready'){if(state.me<i){await offer(i)}else if(!peers.has(i)){peer(i);await signal(i,{type:'ready'})}return}const p=peer(i);if(d.type==='offer'||d.type==='answer'){await p.pc.setRemoteDescription({type:d.type,sdp:d.sdp});for(const c of p.ice.splice(0))await p.pc.addIceCandidate(c).catch(()=>{});if(d.type==='offer'){await p.pc.setLocalDescription(await p.pc.createAnswer());await signal(i,{type:'answer',sdp:p.pc.localDescription.sdp})}}else if(d.type==='ice'){if(p.pc.remoteDescription)await p.pc.addIceCandidate(d.candidate).catch(()=>{});else p.ice.push(d.candidate)}}
setInterval(async()=>{if(!stream||!state||videoBusy)return;videoBusy=true;const gen=videoGeneration;try{const rows=await signal(-1,null,cursor);for(const m of rows){if(gen!==videoGeneration||!stream)break;cursor=Math.max(cursor,m.id);await receive(m).catch(()=>{})}}catch{}finally{videoBusy=false}},1200);
setInterval(()=>{if(stream)announceVideo().catch(()=>{})},12000);
function toggleMic(){if(!stream)return;const t=stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mic').textContent=t.enabled?'🎙️ 麦克风开':'🔇 麦克风关'}}
function stopVideo(){voiceOnly=false;$('voiceBtn').textContent='🎙️ 语音';videoGeneration++;if(stream&&state){const room=videoRoom;state.names.forEach((_,i)=>{if(i!==state.me)signal(i,{type:'bye'},0,room).catch(()=>{})})}if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;for(const i of [...peers.keys()])closePeer(i);$('localVideo').srcObject=null;$('videos').append($('localVideo'));$('videoArea').hidden=true;$('videoBtn').textContent='📹 开启视频'}

const pipMap={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function die(v){const d=document.createElement('span');d.className='die-tile'+([1,4].includes(v)?' red':'');d.setAttribute('aria-label',v+'点');for(let j=0;j<9;j++){const p=document.createElement('i');p.className='pip'+(pipMap[v]?.includes(j)?' on':'');d.append(p)}return d}
let seatKey='',diceKey='',lastTurnKey='',selectedBidKey='',rolling=false,toastTimer=0;
function attachVideos(){if(!state)return;const local=$('localVideo');if(local&&stream){const a=$('avatar'+state.me);if(a&&stream.getVideoTracks().length)a.append(local)}for(const [i,p] of peers){const v=$('peer'+i),a=$('avatar'+i);if(v&&a&&v.srcObject?.getVideoTracks().length)a.append(v);else if(v&&v.srcObject?.getAudioTracks().length)$('audioRemote').append(v)}}
function renderTable(s,n){const key=JSON.stringify([s.code,s.me,n]);if(key!==seatKey){seatKey=key;const videos=[...document.querySelectorAll('.avatar video')];videos.forEach(v=>$('videos').append(v));$('seats').replaceChildren();const count=n.length;const order=Array.from({length:count},(_,k)=>(s.me+k)%count);const slots=count===2?[0,2]:count===3?[0,1,3]:[0,1,2,3];for(let pos=0;pos<4;pos++){const k=slots.indexOf(pos),i=k>=0?order[k]:-1;const el=document.createElement('div');el.className='seat'+(i<0?' empty':'');el.dataset.pos=pos;el.dataset.player=i;const avatar=document.createElement('div');avatar.className='avatar';avatar.id=i<0?'empty'+pos:'avatar'+i;avatar.textContent=i<0?'＋':i>=s.names.length?['🤖','🦊','🐼','🦁'][i%4]:['😎','🙂','🧑','👩'][i%4];const name=document.createElement('div');name.className='name';name.textContent=i<0?'空座':n[i]+(i===s.me?' · 我':'');const tag=document.createElement('div');tag.className='tag';const cup=document.createElement('span');cup.className='mini-cup';cup.textContent=i<0?'':'🎲';el.append(avatar,name,tag,cup);$('seats').append(el)}attachVideos()}
document.querySelectorAll('.seat').forEach(el=>{const i=Number(el.dataset.player);el.classList.toggle('active',s.phase==='play'&&i===s.turn);el.classList.toggle('winner',s.phase==='end'&&i===s.outcome?.winner);el.querySelector('.tag').textContent=i<0?'':s.phase==='end'&&i===s.outcome?.winner?'🏆 胜利':s.phase==='play'&&i===s.turn?'正在叫骰':s.phase==='shake'?(i>=s.names.length||s.ready.includes(i)?'已摇骰':'等待摇骰'):i>=s.names.length?'机器人':i===0?'房主':'真人'});
$('bidBadge').textContent=s.phase==='end'?'🏆 '+n[s.outcome.winner]+' 获胜':s.bid?s.bid.q+' 个 '+s.bid.f+' 点':s.phase==='lobby'?'好友围桌':s.phase==='shake'?'准备摇骰':'等待首叫';
const t=JSON.stringify([s.code,s.phase,s.turn,s.bid]);if(t!==lastTurnKey){lastTurnKey=t;if(s.phase==='play'&&s.turn===s.me){toast('轮到你了！');try{navigator.vibrate?.(60)}catch{}}}
}
function renderDice(s){if(!s.dice){peeked=false;}const k=JSON.stringify(s.dice);if(k!==diceKey){diceKey=k;$('dice').replaceChildren(...(s.dice||[]).map(die))}$('cup').hidden=!!s.dice&&peeked&&!rolling;$('peek').hidden=!s.dice||peeked||rolling||s.phase==='end';$('cup').classList.toggle('shaking',rolling);$('dice').style.visibility=rolling||!peeked?'hidden':'visible'}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,1700)}
function stepQty(d){$('qty').value=Math.max(1,Math.min(Number($('qty').max),Number($('qty').value||1)+d));refreshFaces()}
function chooseFace(v){$('face').value=v;refreshFaces()}
function refreshFaces(){if(!state)return;document.querySelectorAll('#facebar button').forEach(b=>b.classList.toggle('selected',Number(b.dataset.face)===Number($('face').value)));const q=Number($('qty').value),f=Number($('face').value),b=state.bid;$('raise').disabled=!(Number.isInteger(q)&&q>=1&&q<=Number($('qty').max)&&(!b||q>b.q||q===b.q&&f>b.f))}
for(let v=1;v<=6;v++){const b=document.createElement('button');b.dataset.face=v;b.setAttribute('aria-label',v+'点');b.append(die(v));b.onclick=()=>chooseFace(v);$('facebar').append(b)}$('qty').addEventListener('input',refreshFaces);
function updateBidControls(s,n){const k=JSON.stringify([s.code,s.phase,s.turn,s.bid]);if(k!==selectedBidKey){selectedBidKey=k;if(s.phase==='play'&&s.turn===s.me){$('qty').value=s.bid?Math.min(n.length*5,s.bid.q+(s.bid.f===6?1:0)):Math.min(3,n.length*5);$('face').value=s.bid?s.bid.f===6?1:s.bid.f+1:2}}refreshFaces();$('hint').textContent=s.phase==='lobby'?'邀请好友入座 · 房主可增减机器人':s.phase==='shake'?(s.ready.includes(s.me)?'已摇好，等待其他玩家':'摇骰后只有自己能看点数'):s.phase==='play'?(s.turn===s.me?'加叫或质疑上一位玩家':'请等待 '+n[s.turn]+' 操作'): '本局结束 · 可以再来一局';$('start').disabled=n.length<2}
async function gameAction(action){if(rolling)return;if(action==='shake'){rolling=true;$('shake').disabled=true;$('cup').hidden=false;$('cup').classList.add('shaking');rattle();try{navigator.vibrate?.([45,30,45,30,45])}catch{}await new Promise(r=>setTimeout(r,1050));rolling=false;$('cup').classList.remove('shaking');await act(action);if(state)render()}else{tone(460,.09);await act(action)}}
function toggleChat(){$('chatPanel').hidden=!$('chatPanel').hidden;$('chatBtn').textContent=$('chatPanel').hidden?'💬 聊天':'💬 收起';if(!$('chatPanel').hidden)$('chat').scrollTop=$('chat').scrollHeight}
function showRules(){alert('每人5颗骰子，仅自己可见。依次叫数量与点数：数量增加，或数量相同且点数增加。1点百搭（叫1点时只算1）。不信上一位就点开，系统公开所有骰子并判断胜负。饮酒完全自愿。')}

let peeked=false,dramaPhase='',dramaRoom='',revealGeneration=0,roundWins=0,roundCount=0,voiceOnly=false,seenReaction='';
function rattle(){if(!audioOn||!audio)return;try{const t=audio.currentTime;for(let i=0;i<24;i++){const dur=.05,b=audio.createBuffer(1,Math.ceil(audio.sampleRate*dur),audio.sampleRate),a=b.getChannelData(0);for(let j=0;j<a.length;j++)a[j]=(Math.random()*2-1)*Math.exp(-j/(audio.sampleRate*.009));const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=b;filter.type='bandpass';filter.frequency.value=900+Math.random()*2200;gain.gain.value=.28;src.connect(filter).connect(gain).connect(audio.destination);src.start(t+i*.038)}}catch{}}
function peekDice(){if(!state?.dice||rolling||peeked)return;peeked=true;tone(520,.10);try{navigator.vibrate?.(30)}catch{}render()}
function closeReveal(){revealGeneration++;$('revealBoard').hidden=true}
function updateDrama(s,n){if(dramaRoom!==s.code){dramaRoom=s.code;dramaPhase='';roundCount=0;roundWins=0;seenReaction=''}if(s.phase==='end'&&dramaPhase!=='end'&&s.hands&&s.outcome){roundCount++;if(s.outcome.winner===s.me)roundWins++;showReveal(s,n)}dramaPhase=s.phase;$('roundInfo').textContent='本次战绩 · '+roundWins+' 胜 / '+roundCount+' 局';const m=s.chat.at(-1);if(m&&m.at!==seenReaction){seenReaction=m.at;if(['👏','😂','😱','👍','🥂'].includes(m.text)){const i=s.names.indexOf(m.name),seat=document.querySelector('.seat[data-player="'+i+'"]');if(seat){const b=document.createElement('span');b.className='bubble';b.textContent=m.text;seat.append(b);setTimeout(()=>b.remove(),1900)}}}}
async function showReveal(s,n){const gen=++revealGeneration;$('revealBoard').hidden=false;$('revealTitle').textContent='开骰！';$('revealCount').textContent='0';$('revealRows').replaceChildren();$('revealDone').hidden=true;let count=0;await new Promise(r=>setTimeout(r,550));for(let i=0;i<s.hands.length;i++){if(gen!==revealGeneration)return;const row=document.createElement('div');row.className='reveal-row';const name=document.createElement('span');name.textContent=n[i];name.style.maxWidth='95px';name.style.overflowWrap='anywhere';const ds=document.createElement('div');ds.className='dice-set';for(const v of s.hands[i]){const d=die(v);if(v===s.bid.f||(v===1&&s.bid.f!==1)){d.classList.add('match');count++}ds.append(d)}row.append(name,ds);$('revealRows').append(row);$('revealCount').textContent=count+' 个 '+s.bid.f+' 点';tone(270+i*100,.16);await new Promise(r=>setTimeout(r,550))}if(gen!==revealGeneration)return;$('revealTitle').textContent='🏆 '+n[s.outcome.winner]+' 获胜';$('revealDone').hidden=false;tone(480,.17);tone(640,.17,.16);tone(820,.2,.32);say(n[s.outcome.winner]+'赢了！')}
function reactTable(message){act('chat',{message})}
async function immersive(){document.body.classList.toggle('immersive');if(document.body.classList.contains('immersive')){try{await document.documentElement.requestFullscreen?.()}catch{}try{await screen.orientation?.lock?.('landscape')}catch{}toast('沉浸模式 · 可旋转手机横屏')}else{try{await document.exitFullscreen?.()}catch{}try{screen.orientation?.unlock?.()}catch{}}}
async function toggleVoice(){if(stream){stopVideo();return}voiceOnly=true;await toggleVideo();if(stream){$('voiceBtn').textContent='🎙️ 结束通话';$('videoBtn').textContent='📹 摄像头关闭';videoNote('语音模式 · 等待其他玩家连接')}}
</script></html>
