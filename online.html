<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不醉不归 · 真人联机</title><style> *{box-sizing:border-box}body{background:#092b24;color:#fff;font:18px system-ui;margin:auto;max-width:560px;padding:16px}section{background:#164437;border:1px solid #c2a465;border-radius:18px;padding:16px;margin:12px 0}button,input{font:inherit;border:1px solid #c2a465;border-radius:10px;padding:12px;margin:4px 0;max-width:100%}button{background:#ffda65;color:#17251d;font-weight:bold}button:disabled{opacity:.45}input{background:#fff;color:#111;width:100%}a{color:#ffda65}#chat{height:160px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}#dice{font-size:47px;letter-spacing:5px}#seats{line-height:1.8}small{color:#dfd8bb} [hidden]{display:none!important}</style><h1>🎲 不醉不归</h1><p>真人联机 · Drink Together</p><a href="./">返回原版小游戏</a><section id="lobby"><input id="nick" maxlength="24" placeholder="你的昵称"><button onclick="enter('create')">创建房间</button><input id="code" maxlength="10" placeholder="输入好友邀请码"><button onclick="enter('join')">加入房间</button></section><section id="game" hidden><strong id="room"></strong> <button onclick="share()">复制邀请链接</button><div id="seats"></div><div id="botSettings" hidden><button onclick="changeBots(-1)">− 移除机器人</button> <span id="botCount"></span> <button onclick="changeBots(1)">＋ 添加机器人</button></div><div><button id="sound" onclick="toggleAudio()">🔊 开启音效</button> <button id="videoBtn" onclick="toggleVideo()">📹 开启视频</button></div><div id="videoArea" hidden><div id="videos" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><video id="localVideo" muted autoplay playsinline style="width:100%;background:#111;border-radius:12px"></video></div><button id="mic" onclick="toggleMic()">🎙️ 麦克风开</button><p id="videoStatus" style="font-size:14px"></p><small>双方主动开启才连接。视频不录制；部分网络可能无法直连。</small></div><p id="status"></p><div id="dice"></div><button id="start" onclick="act('start')">开始 / 下一局</button><button id="shake" onclick="act('shake')">🎲 摇骰</button><div id="controls" hidden><label>数量<input id="qty" type="number" min="1" max="20" value="3"></label><label>点数<input id="face" type="number" min="1" max="6" value="2"></label><button onclick="act('bid')">叫骰</button><button id="open" onclick="act('open')">开骰</button></div><pre id="result" style="white-space:pre-wrap"></pre><small>每人5颗骰，1点百搭；房主可在开局前自由增减机器人。饮酒自愿。</small><hr><div id="chat"></div><input id="msg" maxlength="300" placeholder="发消息"><button onclick="send()">发送</button><button onclick="leave()">退出房间</button></section><p id="error" role="status"></p><script>
const $=id=>document.getElementById(id), key='sb_publishable_J2YJjwZmWfmm0URtc-xpRQ_nZD5zkoq', url='https://qmjcxmktozldpaujyeva.supabase.co/rest/v1/rpc/drink_party_action';
let token=localStorage.getItem('dt_token');if(!token){token=Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('dt_token',token)}
let state=null,busy=false,lastChat='',botAt=0,botKey='';
$('code').value=new URLSearchParams(location.search).get('room')||localStorage.getItem('dt_room')||'';$('nick').value=localStorage.getItem('dt_nick')||'';
async function act(action,extra={}){if(busy){if(action==='state'||action==='bot')return;await new Promise(r=>setTimeout(r,100));return act(action,extra)}busy=true;try{const res=await fetch(url,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({action,room:state?.code||$('code').value.trim(),token,nickname:$('nick').value,...extra,...(action==='bid'?{qty:Number($('qty').value),face:Number($('face').value)}:{})})});const data=await res.json();if(!res.ok)throw Error(data.message||'连接失败');state=data;$('error').textContent='';render();}catch(e){$('error').textContent='操作提示：'+e.message;}finally{busy=false}}
async function enter(action){await act(action);if(state){localStorage.setItem('dt_room',state.code);localStorage.setItem('dt_nick',$('nick').value)}}
function render(){const s=state,n=[...s.names];while(n.length<s.names.length+(s.bots??(4-s.names.length)))n.push('🤖 机器人 '+(n.length+1));$('botSettings').hidden=s.me!==0||!['lobby','end'].includes(s.phase);$('botCount').textContent=(s.bots??0)+' 个';$('qty').max=n.length*5;updateAudio(s,n);$('lobby').hidden=true;$('game').hidden=false;$('room').textContent='邀请码：'+s.code;$('seats').textContent=n.map((v,i)=>(i===s.turn&&s.phase==='play'?'▶ ':'')+v+(i===s.me?'（你）':'' )).join(' · ');$('status').textContent=({lobby:'等待好友加入，房主可开始',shake:'等待所有真人摇骰',play:'轮到 '+n[s.turn],end:'本局结束'})[s.phase]+(s.bid?' ｜ '+n[s.bid.by]+' 叫 '+s.bid.q+' 个 '+s.bid.f:'');$('dice').textContent=(s.dice||[]).map(v=>'⚀⚁⚂⚃⚄⚅'[v-1]).join('');$('start').hidden=s.me!==0||!['lobby','end'].includes(s.phase);$('shake').hidden=s.phase!=='shake';$('shake').disabled=s.ready.includes(s.me);$('controls').hidden=s.phase!=='play'||s.turn!==s.me;$('open').disabled=!s.bid;$('result').textContent=s.outcome?'实际数量 '+s.outcome.actual+'，'+n[s.outcome.winner]+' 赢！\n'+s.hands.map((h,i)=>n[i]+': '+h.join(' ')).join('\n'):'';const chat=s.chat.map(m=>m.name+'：'+m.text).join('\n');if(chat!==lastChat){$('chat').textContent=chat;$('chat').scrollTop=$('chat').scrollHeight;lastChat=chat}const b=JSON.stringify([s.phase,s.turn,s.bid]);if(b!==botKey){botKey=b;botAt=Date.now()+1600}}
function send(){const message=$('msg').value.trim();if(message){$('msg').value='';act('chat',{message})}}
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});function leave(){stopVideo();state=null;localStorage.removeItem('dt_room');$('game').hidden=true;$('lobby').hidden=false;history.replaceState(null,'',location.pathname)}
async function share(){const link=location.origin+location.pathname+'?room='+state.code;try{await navigator.clipboard.writeText(link);$('error').textContent='邀请链接已复制'}catch{prompt('复制链接',link)}}
setInterval(()=>{if(!state||busy||document.hidden)return;if(state.phase==='play'&&state.turn>=state.names.length&&Date.now()>=botAt)act('bot');else act('state')},1800);

// Optional robot seats and local synthesized sound.
function changeBots(d){if(!state)return;act('bots',{qty:Math.max(0,Math.min(4-state.names.length,(state.bots||0)+d))})}
let audio=null,audioOn=false,audioLast=null;
function toggleAudio(){audioOn=!audioOn;if(audioOn){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}tone(540,.13)}$('sound').textContent=audioOn?'🔊 音效开':'🔇 音效关';if(!audioOn&&window.speechSynthesis)speechSynthesis.cancel()}
function tone(hz,dur,delay=0){if(!audioOn||!audio)return;try{const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.frequency.value=hz;g.gain.setValueAtTime(.11,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur)}catch{}}
function say(t){if(!audioOn||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';speechSynthesis.speak(u)}catch{}}
function updateAudio(s,n){const old=audioLast;audioLast={code:s.code,phase:s.phase,bid:JSON.stringify(s.bid),ready:s.ready.length,chat:s.chat.at(-1)?.at};if(!old||old.code!==s.code)return;if(s.ready.length>old.ready){for(let i=0;i<12;i++)tone(170+Math.random()*500,.035,i*.045)}if(s.bid&&JSON.stringify(s.bid)!==old.bid){tone(420,.12);say(n[s.bid.by]+'叫'+s.bid.q+'个'+s.bid.f)}if(s.phase==='end'&&old.phase!=='end'){tone(440,.15);tone(660,.2,.15);say(n[s.outcome.winner]+'赢了')}if(s.chat.at(-1)?.at!==old.chat)tone(720,.08)}
// Peer-to-peer video, no paid relay. Each user explicitly enables camera.
let stream=null,peers=new Map(),cursor=0,videoBusy=false,videoRoom='',videoGeneration=0;
async function signal(recipient=-1,payload=null,after_id=0,room=videoRoom){const res=await fetch(url.replace('drink_party_action','drink_party_video'),{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({room,token,recipient,payload,after_id})});const j=await res.json();if(!res.ok)throw Error(j.message||'视频连接失败');return j}
function videoNote(t){$('videoStatus').textContent=t}
async function toggleVideo(){if(stream){stopVideo();return}if(!state)return;const gen=++videoGeneration;videoRoom=state.code;try{const local=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});if(gen!==videoGeneration||!state||state.code!==videoRoom){local.getTracks().forEach(t=>t.stop());return}stream=local;$('localVideo').srcObject=stream;$('videoArea').hidden=false;$('videoBtn').textContent='📹 关闭视频';videoNote('等待其他真人开启视频…');const history=await signal();cursor=history.at(-1)?.id||0;await announceVideo()}catch(e){stopVideo();$('error').textContent='视频：'+e.message}}
async function announceVideo(){if(!stream||!state)return;await Promise.allSettled(state.names.map((_,i)=>i===state.me?Promise.resolve():signal(i,{type:'ready'})))}
function peer(i){if(peers.has(i))return peers.get(i);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});const p={pc,ice:[],offered:false};peers.set(i,p);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)signal(i,{type:'ice',candidate:e.candidate.toJSON()}).catch(()=>{})};pc.ontrack=e=>{let v=$('peer'+i);if(!v){v=document.createElement('video');v.id='peer'+i;v.autoplay=true;v.playsInline=true;v.style='width:100%;background:#111;border-radius:12px';$('videos').append(v)}v.srcObject=e.streams[0];v.play().catch(()=>{});videoNote('视频已连接')};pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')videoNote('视频直连失败，请尝试其他网络或重新开启视频');if(pc.connectionState==='connected')videoNote('视频已连接')};return p}
async function offer(i){const p=peer(i);if(p.offered)return;p.offered=true;await p.pc.setLocalDescription(await p.pc.createOffer());await signal(i,{type:'offer',sdp:p.pc.localDescription.sdp})}
function closePeer(i){const p=peers.get(i);if(p)p.pc.close();peers.delete(i);$('peer'+i)?.remove()}
async function receive(m){const i=m.sender,d=m.payload;if(d.type==='bye'){closePeer(i);return}if(d.type==='ready'){if(state.me<i){await offer(i)}else if(!peers.has(i)){peer(i);await signal(i,{type:'ready'})}return}const p=peer(i);if(d.type==='offer'||d.type==='answer'){await p.pc.setRemoteDescription({type:d.type,sdp:d.sdp});for(const c of p.ice.splice(0))await p.pc.addIceCandidate(c).catch(()=>{});if(d.type==='offer'){await p.pc.setLocalDescription(await p.pc.createAnswer());await signal(i,{type:'answer',sdp:p.pc.localDescription.sdp})}}else if(d.type==='ice'){if(p.pc.remoteDescription)await p.pc.addIceCandidate(d.candidate).catch(()=>{});else p.ice.push(d.candidate)}}
setInterval(async()=>{if(!stream||!state||videoBusy)return;videoBusy=true;const gen=videoGeneration;try{const rows=await signal(-1,null,cursor);for(const m of rows){if(gen!==videoGeneration||!stream)break;cursor=Math.max(cursor,m.id);await receive(m).catch(()=>{})}}catch{}finally{videoBusy=false}},1200);
setInterval(()=>{if(stream)announceVideo().catch(()=>{})},12000);
function toggleMic(){if(!stream)return;const t=stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mic').textContent=t.enabled?'🎙️ 麦克风开':'🔇 麦克风关'}}
function stopVideo(){videoGeneration++;if(stream&&state){const room=videoRoom;state.names.forEach((_,i)=>{if(i!==state.me)signal(i,{type:'bye'},0,room).catch(()=>{})})}if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;for(const i of [...peers.keys()])closePeer(i);$('localVideo').srcObject=null;$('videoArea').hidden=true;$('videoBtn').textContent='📹 开启视频'}
</script></html>
