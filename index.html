<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今晚有局 Tonight Party</title><style>*{box-sizing:border-box}body{margin:0;background:#111021;color:#f9f4ff;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:50px 0 6px}p{color:#bdb5cc}button,select,input{font:inherit;border-radius:13px;padding:13px;border:1px solid #554c69;background:#29263d;color:white}button{cursor:pointer}button.primary{background:#b95c87;border:0;font-weight:700;width:100%;margin:8px 0}section{background:#211d34;padding:18px;border-radius:20px;margin:18px 0}label{display:block;margin:12px 0 5px;color:#e5dce9}select,input{width:100%}.muted{font-size:13px;color:#b8adc8}.dice{display:flex;gap:8px;justify-content:center}.die{background:white;color:#171327;border-radius:12px;font-size:30px;width:53px;height:53px;display:grid;place-items:center}.hidden{display:none}#notice{padding:12px;border-radius:12px;background:#37304d}</style><main><header><strong>🌙 今晚有局</strong><button onclick="lang=lang==='zh'?'en':'zh';render()">中文 / EN</button></header><h1 id="headline"></h1><p id="sub"></p><section><button class="primary" onclick="show('match')" id="matchbtn"></button><button class="primary" onclick="show('private')" id="privatebtn"></button><p class="muted" id="warning"></p></section><section id="match" class="hidden"><h2 id="matchtitle"></h2><label id="genderlabel"></label><select id="gender"><option value="all">男女不限 / Anyone</option><option value="same">同性 / Same gender</option><option value="opposite">异性 / Other gender</option></select><label id="countlabel"></label><select><option>3–6</option><option>1–1 (coming soon)</option></select><label id="calllabel"></label><select><option>语音 / Voice</option><option disabled>视频 / Video (coming soon)</option></select><button class="primary" onclick="document.getElementById('notice').textContent=lang==='zh'?'真实匹配尚未接入，当前仅为界面体验。':'Live matching is not connected yet; this is a UI demo.';" id="startbtn"></button><div id="notice"></div></section><section id="private" class="hidden"><h2 id="privatetitle"></h2><input id="room" placeholder="房间名称 / Room name"><button class="primary" onclick="document.getElementById('privateinfo').textContent=lang==='zh'?'私人房间的真实联机功能尚未接入。':'Online private rooms are not connected yet.';" id="createbtn"></button><p id="privateinfo"></p></section><section id="bot"><h2>🤖 <span id="bottitle">单人机器人陪玩 / Solo Bot</span></h2><p class="muted">模拟机器人（非真人、非AI模型） · Offline scripted bot</p><div id="chatlog" style="height:170px;overflow:auto;background:#151325;padding:12px;border-radius:12px;margin:12px 0" aria-live="polite"></div><input id="chatinput" maxlength="200" placeholder="说点什么 / Say something"><button class="primary" onclick="sendBot()">发送 / Send</button><button onclick="botGame()">🎲 和机器人比大小 / Dice duel</button><button onclick="botPrompt()">💬 随机话题 / Topic</button><p id="botresult" aria-live="polite"></p></section><section><h2 id="gametitle"></h2><div class="dice" id="dice"></div><button class="primary" onclick="roll()" id="rollbtn"></button><p id="question"></p><button onclick="question()" id="questionbtn"></button></section><p class="muted" id="footer"></p></main><script>let lang='zh';const z={zh:['今晚，找个人一起玩','远隔千里，也能同桌聊天、玩游戏。','随机匹配','创建私人酒局','当前为单机体验版，尚无真人匹配或语音。','匹配设置','匹配对象','房间人数','聊天方式','开始匹配','私人房间','创建房间','派对小游戏','摇骰子','抽一个聊天话题','本网站为原型，游戏不要求饮酒。'],en:['Find your people tonight','Miles apart, together for a game and a chat.','Random match','Private party','This is a local demo: no live matching or voice yet.','Match preferences','Who to match','Room size','Call type','Start matching','Private room','Create room','Party games','Roll dice','Conversation prompt','Prototype only. Drinking is never required.']};const ids=['headline','sub','matchbtn','privatebtn','warning','matchtitle','genderlabel','countlabel','calllabel','startbtn','privatetitle','createbtn','gametitle','rollbtn','questionbtn','footer'];function render(){ids.forEach((id,i)=>document.getElementById(id).textContent=z[lang][i])}function show(id){document.getElementById(id).classList.toggle('hidden')}function roll(){document.getElementById('dice').innerHTML=Array.from({length:5},()=>'<span class="die">'+(1+Math.floor(Math.random()*6))+'</span>').join('')}function question(){let q=lang==='zh'?['你最想和哪位老朋友重新聚一聚？','你最难忘的一次旅行是什么？','如果现在能瞬间去任何地方，你会去哪里？','你小时候最想做什么工作？']:['Which old friend would you love to see?','What was your most memorable trip?','Where would you teleport right now?','What did you want to be as a kid?'];document.getElementById('question').textContent=q[Math.floor(Math.random()*q.length)]}const repliesZh=['今晚想聊点什么？','我在这里陪你玩一会儿。','你平时喜欢什么游戏？','要不要来一局骰子？','听起来挺有意思的，再说说？'];const repliesEn=['What would you like to talk about?','I can play a round with you.','What games do you enjoy?','Want to roll the dice?','That sounds interesting. Tell me more.'];function appendChat(who,msg){const d=document.createElement('div');d.style.marginBottom='9px';const b=document.createElement('strong');b.textContent=who+': ';d.append(b,document.createTextNode(msg));document.getElementById('chatlog').append(d);document.getElementById('chatlog').scrollTop=99999}function sendBot(){const el=document.getElementById('chatinput'),v=el.value.trim();if(!v)return;appendChat(lang==='zh'?'我':'Me',v);el.value='';const a=lang==='zh'?repliesZh:repliesEn;appendChat('🤖 Bot',a[Math.floor(Math.random()*a.length)])}function botGame(){const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);document.getElementById('botresult').textContent=lang==='zh'?'你掷出 '+a+'，机器人掷出 '+b+'。'+(a>b?'你赢了！':a<b?'机器人赢了！':'平局！'):'You rolled '+a+', bot rolled '+b+'. '+(a>b?'You win!':a<b?'Bot wins!':'Tie!');appendChat('🤖 Bot',document.getElementById('botresult').textContent)}function botPrompt(){question();appendChat('🤖 Bot',document.getElementById('question').textContent)}document.getElementById('chatinput').addEventListener('keydown',e=>{if(e.key==='Enter')sendBot()});render();roll();appendChat('🤖 Bot','你好！我是测试机器人，可以陪你玩骰子。 / Hi! I am a demo bot.');</script></html>
